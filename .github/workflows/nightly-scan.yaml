name: NIGHTLY-SCAN

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  get-matrix-values:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-var.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: set-var
        run: |
          echo 'image<<EOF' >> $GITHUB_OUTPUT
          cat ./image-matrix.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  trivy-scan:
    runs-on: ubuntu-latest
    needs:  get-matrix-values
    strategy:
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set job environment variables
        run:  cat JOB.env >> $GITHUB_ENV

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-python${{matrix.image.pythonVersion}}
          format: sarif
          output: trivy-reports-python-${{ matrix.image.pythonVersion }}
          exit-code: 1
          vuln-type: os,library
          trivyignores: '.trivyignore'
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload Trivy SARIF report
        if: ${{ steps.trivy-scan.outcome == 'failure' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: trivy-reports-python-${{ matrix.image.pythonVersion }}
          path: trivy-reports-python-${{ matrix.image.pythonVersion }}

      - name: Fail build if scan failed
        if: ${{ steps.trivy-scan.outcome == 'failure' }}
        run: |
          echo "Trivy scan failed. Failing the build."
          exit 1

  anchore-scan:
    runs-on: ubuntu-latest
    needs:  get-matrix-values
    strategy:
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set job environment variables
        run:  cat JOB.env >> $GITHUB_ENV
      
      - name: Run Anchore Grype scan
        id: grype-scan
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c
        with:
          image: defradigital/${{env.IMAGE_NAME}}:${{env.DEFRA_VERSION}}-python${{matrix.image.pythonVersion}}
          fail-build: true
          severity-cutoff: "medium"
        continue-on-error: true

      - name: Upload Grype SARIF report
        if: ${{ steps.grype-scan.outcome == 'failure' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: grype-reports-python-${{ matrix.image.pythonVersion }}
          path: ${{ steps.grype-scan.outputs.sarif }}

      - name: Fail build if scans failed
        if: ${{ (steps.grype-scan.outcome == 'failure') }}
        run: |
          echo "One or more scans failed. Failing the build."
          exit 1
